plugins {
    id 'com.android.application'
}

def midletArchivesBaseName
def legacyKeystorePropertiesFile = rootProject.file("keystore.properties")
def hasLegacyReleaseKey = System.getenv()['BITRISE_IO'] || legacyKeystorePropertiesFile.isFile()

android {
    compileSdk COMPILE_SDK
    // Keep the source namespace stable; the installed package/application id is the legacy id.
    namespace 'ru.playsoftware.j2meloader'

    defaultConfig {
        applicationId "ru.playsoftware.j2meloader.legacy"
        minSdk MIN_SDK
        targetSdk TARGET_SDK
        versionCode 104
        versionName "1.8.4"
        resValue 'string', 'app_name', rootProject.name
        buildConfigField 'boolean', 'FULL_EMULATOR', 'true'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        // Language-level Java 8 desugaring is handled by D8.  Core-library
        // desugaring is intentionally disabled: AGP requires multidex for
        // core-library desugaring on API < 21, while the legacy artifact must
        // contain a single classes.dex for stock Dalvik.
    }

    signingConfigs {
        // The fallback local key is also used for release builds when the
        // external release keystore is unavailable. Keep the fallback Dalvik-compatible.
        debug {
            enableV1Signing true
            enableV2Signing false
        }
        release {
            enableV1Signing true
            enableV2Signing false
            if (System.getenv()['BITRISE_IO']) {
                keyAlias System.getenv('BITRISEIO_ANDROID_KEYSTORE_ALIAS')
                keyPassword System.getenv('BITRISEIO_ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD')
                storeFile rootProject.file(System.getenv('BITRISEIO_ANDROID_KEYSTORE_NAME'))
                storePassword System.getenv('BITRISEIO_ANDROID_KEYSTORE_PASSWORD')
            } else if (legacyKeystorePropertiesFile.isFile()) {
                Properties keystoreProps = new Properties()
                keystoreProps.load(new FileInputStream(legacyKeystorePropertiesFile))
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // A release key can be supplied through keystore.properties outside Git.
            // Falling back to the debug key keeps local artifact verification reproducible.
            signingConfig hasLegacyReleaseKey ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-common.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            jniDebuggable false
            multiDexEnabled false
        }
    }

    lint {
        disable 'MissingTranslation', 'ExtraTranslation'
        // The upstream tree still contains Bluetooth and post-API-10 helper
        // sources that are excluded from this legacy source set. Lint scans
        // those files before source-set excludes are applied, so suppress only
        // the checks that would otherwise fail the API 10 build.
        disable 'MissingPermission', 'NewApi', 'UnsafeImplicitIntentLaunch', 'StringFormatMatches'
    }

    packagingOptions {
        // Legacy Dalvik must receive one classes.dex and no native payload.
        jniLibs.useLegacyPackaging = false
    }

    applicationVariants.all {
        if (buildType.name == 'debug') {
            resValue 'string', 'app_name', 'JL-Debug'
        }
        def baseName = "J2ME-Loader-Android-2.3-"
        outputs.all {
            outputFileName = "${baseName}${versionName}.apk"
                    .replaceAll('--+', '-').replaceAll(' +', '_')
        }
    }

    buildFeatures {
        viewBinding false
    }

    // The API 10 shell is deliberately the only application UI in this branch. The old
    // database/preferences/fragments are excluded from compilation instead of pulling their
    // AndroidX/Room/Material dependency graph into the single-Dex legacy artifact.
    sourceSets {
        main {
            java {
                exclude 'ru/playsoftware/j2meloader/MainActivity.java'
                exclude 'ru/playsoftware/j2meloader/applist/**'
                exclude 'ru/playsoftware/j2meloader/appsdb/**'
                exclude 'ru/playsoftware/j2meloader/base/**'
                exclude 'ru/playsoftware/j2meloader/info/**'
                exclude 'ru/playsoftware/j2meloader/settings/**'
                exclude 'ru/playsoftware/j2meloader/storage/**'
                exclude 'ru/playsoftware/j2meloader/config/ConfigActivity.java'
                exclude 'ru/playsoftware/j2meloader/config/EditNameDialog.java'
                exclude 'ru/playsoftware/j2meloader/config/LoadProfileDialog.java'
                exclude 'ru/playsoftware/j2meloader/config/ProfilesActivity.java'
                exclude 'ru/playsoftware/j2meloader/config/ProfilesAdapter.java'
                exclude 'ru/playsoftware/j2meloader/config/SaveProfileDialog.java'
                exclude 'ru/playsoftware/j2meloader/config/ShaderTuneDialog.java'
                exclude 'ru/playsoftware/j2meloader/util/AppUtils.java'
                exclude 'ru/playsoftware/j2meloader/util/MigrationUtils.java'
                exclude 'ru/playsoftware/j2meloader/util/Pick*ResultContract.java'
                exclude 'ru/playsoftware/j2meloader/util/SAFFileResultContract.java'
                exclude 'ru/woesss/j2me/installer/**'
            }
        }
    }
}

static def generateVersionCode() {
    def result = "git rev-list HEAD --count".execute().text.trim()
    return result.toInteger()
}

def getMidletManifestProperties() {
    def file = project.file('src/midlet/resources/MIDLET-META-INF/MANIFEST.MF')
    def mf = new java.util.jar.Manifest()
    if (file.exists()) {
        def is = null
        try {
            is = new FileInputStream(file)
            mf.read(is)
        } finally {
            if (is != null) is.close()
        }
    }
    return mf.mainAttributes
}

dependencies {
    implementation project(':dexlib')

    // Local metadata parsing only; no Room/LiveData/AndroidX/Material dependency graph.
    implementation 'com.google.code.gson:gson:2.9.0'

    // Tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.ow2.asm:asm:5.2'
}

/** Release gate for the old Dalvik loader: one 035 dex and no native payload. */
tasks.register('verifyLegacyArtifact') {
    dependsOn 'assembleRelease'
    doLast {
        File mergedManifest = file(
                "${buildDir}/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml")
        if (!mergedManifest.isFile()) {
            throw new GradleException("Missing merged release manifest: ${mergedManifest}")
        }
        def manifest = new XmlParser(false, false).parse(mergedManifest)
        def androidAttribute = { node, String name -> node.attributes()["android:${name}"] }
        def hasInternetPermission = manifest.'uses-permission'.any {
            androidAttribute(it, 'name') == 'android.permission.INTERNET'
        }
        if (!hasInternetPermission) {
            throw new GradleException('Release manifest must declare android.permission.INTERNET')
        }
        def activities = manifest.application.activity
        def midletActivity = activities.find {
            androidAttribute(it, 'name') == 'javax.microedition.shell.MicroActivity'
        }
        if (midletActivity == null || androidAttribute(midletActivity, 'process') != ':midlet') {
            throw new GradleException(
                    'Release MicroActivity must run in the private :midlet process')
        }
        def launcherActivity = activities.find {
            androidAttribute(it, 'name') ==
                    'ru.playsoftware.j2meloader.legacy.LegacyMainActivity'
        }
        if (launcherActivity == null || androidAttribute(launcherActivity, 'process') != null) {
            throw new GradleException(
                    'Release LegacyMainActivity must remain in the main application process')
        }
        if (androidAttribute(launcherActivity, 'launchMode') != 'singleTop') {
            throw new GradleException(
                    'Release LegacyMainActivity must use singleTop to retain the MIDlet task')
        }

        File outputDir = file("${buildDir}/outputs/apk/release")
        File[] candidates = outputDir.listFiles({ File file -> file.name.endsWith('.apk') } as FileFilter)
        if (candidates == null || candidates.length != 1) {
            throw new GradleException("Expected one legacy APK in ${outputDir}")
        }
        java.util.zip.ZipFile apk = new java.util.zip.ZipFile(candidates[0])
        try {
            int dexCount = 0
            boolean hasV1 = false
            java.util.Enumeration<? extends java.util.zip.ZipEntry> entries = apk.entries()
            while (entries.hasMoreElements()) {
                String name = entries.nextElement().name
                if (name == 'classes.dex') {
                    dexCount++
                    InputStream input = apk.getInputStream(apk.getEntry(name))
                    byte[] magic = new byte[8]
                    try { input.read(magic) } finally { input.close() }
                    if (!(magic[0] == (byte)'d' && magic[1] == (byte)'e' && magic[2] == (byte)'x'
                            && magic[3] == (byte)'\n' && magic[4] == (byte)'0' && magic[5] == (byte)'3'
                            && magic[6] == (byte)'5')) {
                        throw new GradleException('classes.dex is not DEX 035')
                    }
                }
                if (name.startsWith('lib/') || name.endsWith('.so')) {
                    throw new GradleException("Native payload is forbidden: ${name}")
                }
                if (name.startsWith('META-INF/') && (name.endsWith('.RSA') || name.endsWith('.DSA')
                        || name.endsWith('.EC'))) hasV1 = true
            }
            if (dexCount != 1 || !hasV1) {
                throw new GradleException("Legacy APK must contain one classes.dex and a v1 signature")
            }
        } finally {
            apk.close()
        }
    }
}
